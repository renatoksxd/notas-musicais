site_name: Notas musicais
repo_url: https://github.com/renatoksxd/notas-musicais
repo_name: renatoksxd/notas-musicais
edit_uri: tree/main/docs

theme: 
    name: material
    language: pt-BR
    logo: assets/logo notas musicais.png
    favicon: assets/logo notas musicais.png

markdown_extensions:
  - attr_list
  - admonition
  - pymdownx.tasklist
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg        

extra_css:
  - stylesheets/extra.css

watch:
  - src/notas_musicais

plugins:
- macros
- mkdocstrings:
    handlers:
      python:
        paths: [src\notas_musicais]

extra:
  commands:
    run: poetry run notas-musicais
