[project]
name = "notas-musicais"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.12, <4.0"
dependencies = [
    "typer (>=0.27.2,<0.28.0)",
    "rich (>=15.0.0,<16.0.0)",
    "pymdown-extensions (>=12.0.1,<13.0.0)"
]

[tool.poetry]
packages = [{include = "notas_musicais", from = "src"}]

[tool.poetry.scripts]
notas-musicais = "notas_musicais.cli:app"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "blue (>=0.9.1,<0.10.0)",
    "click (>=8.0,<8.2)",
    "isort (>=9.0.1,<10.0.0)",
    "taskipy (>=1.14.1,<2.0.0)"
]
doc = [
    "mkdocs-material (>=9.7.7,<10.0.0)",
    "mkdocstrings (>=1.0.6,<2.0.0)",
    "mkdocstrings-python (>=2.0.8,<3.0.0)",
    "mkdocs-macros-plugin (>=1.5.0,<2.0.0)",
    "jinja2 (>=3.1.6,<4.0.0)"
]

[tool.pytest.ini_options]
pythonpath = "."
addopts = "--doctest-modules"

[tool.isort]
profile = "black"
line_length = 79

[tool.taskipy.tasks]
lint = "blue --check --diff . && isort --check --diff ."
docs = "mkdocs serve"
pre_test = "task lint"
test = "pytest -s -x --cov=notas_musicais -vv"
post_test = "coverage html"